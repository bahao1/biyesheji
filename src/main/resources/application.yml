spring:
  application:
    name: campus-wall

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_wall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: bahao520

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 开发环境使用update，生产环境改为validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

# 文件存储配置
file:
  upload:
    path: uploads
    max-size: 10485760  # 10MB

# AI配置(硅基流动 - Qwen2.5-7B微调模型)
ai:
  api:
    key: sk-qhoruurmzidswdbmzgtgjftstykcfqqtvdhaqpnerasndzkw
    url: https://api.siliconflow.cn/v1/chat/completions
    model: ft:LoRA/Qwen/Qwen2.5-7B-Instruct:xfqjbhsr1c:xue:rutqabyamrvqhvejmgoe-ckpt_step_1

# JWT配置
jwt:
  secret: campus-wall-secret-key-2024-graduation-project-very-long-secret
  expiration: 604800000  # 7天，单位毫秒
  header: Authorization
  prefix: Bearer

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# Knife4j配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    root: info
    com.example.biyesheji: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
